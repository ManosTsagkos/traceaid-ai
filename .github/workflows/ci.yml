name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy src

      - name: Check dependency compatibility
        run: python -m pip check

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        env:
          OPENAI_API_KEY: ""
          TRACEAID_ENABLE_LIVE_PROBES: "false"
        run: pytest --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and audit tool
        run: |
          python -m pip install --upgrade pip "setuptools>=84.0.0"
          python -m pip install . pip-audit

      - name: Audit dependencies
        run: pip-audit

  browser:
    name: Browser regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -e ".[dev]"
      - run: python -m traceaid.static_demo --output site
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  package:
    name: Build and installed-wheel smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install the wheel in a separate environment
        run: |
          python -m venv "$RUNNER_TEMP/traceaid-wheel"
          "$RUNNER_TEMP/traceaid-wheel/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/traceaid-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/traceaid-wheel/bin/python" -m pip check
      - name: Verify packaged assets, API, CLI, and demo builder
        run: '"$RUNNER_TEMP/traceaid-wheel/bin/python" scripts/check-installed.py'

  gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    needs: [quality, tests, dependency-audit, browser, package]
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const jobs = JSON.parse(process.env.RESULTS);
            if (!Object.keys(jobs).length || Object.values(jobs).some(job => job.result !== "success")) {
              console.error("All required validation jobs must succeed.", jobs);
              process.exit(1);
            }
          '

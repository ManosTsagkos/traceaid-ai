name: Bug report
description: Report reproducible incorrect behavior using synthetic, redacted data.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Remove API keys, cookies, tokens, signed URLs, and proprietary payloads before submitting.

  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive-data check
      options:
        - label: I replaced all credentials and private payloads with synthetic values.
          required: true
        - label: This is not a security vulnerability.
          required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true

  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - Web UI
        - REST API
        - CLI
        - Docker
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the observed and expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use example.com and synthetic values. Do not paste a production request.
      render: shell
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Python version, browser, container runtime

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Optional. Check the content again for secrets before submitting.
      render: text
